services:
  localstack:
    image: localstack/localstack:3.0.0  # Pin version for reproducibility
    container_name: aws-guardian-localstack
    ports:
      - "4566:4566"  # LocalStack Edge endpoint
      - "4571:4571"  # Elasticsearch (unused, but kept for compatibility)
    env_file:
      - .env
    environment:
      # Debug Mode (LOCAL DEVELOPMENT ONLY)
      - DEBUG=1

      # Lambda Execution
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock

      # AWS Service Credentials (LOCAL TESTING ONLY - not for production)
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1

      # Enabled Services
      - SERVICES=lambda,ec2,s3,dynamodb,logs,ssm,events,apigateway,iam

      # Performance Optimization
      - LOCALSTACK_LAMBDA_STUB_ECR=false

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./data/localstack:/tmp/localstack  # Persistent storage

    networks:
      - guardian-network

    # Resource Limits (local development)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    healthcheck:
      # Use S3 instead of Kinesis (S3 is always enabled)
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s  # Allow startup time

    restart: unless-stopped

networks:
  guardian-network:
    driver: bridge
    name: aws-guardian-network
