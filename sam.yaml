AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'AWS Guardian - Serverless Security Monitoring'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        AWS_ENV: localstack

Resources:
  GuardianCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GuardianChecker
      CodeUri: lambda/
      Handler: guardian/handler.lambda_handler
      # Least-privilege policy mirroring terraform/iam.tf
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeRegions
                - ec2:DescribeSecurityGroups
                - ce:GetCostAndUsage
              Resource: '*'
            - Effect: Allow
              Action:
                - ec2:StopInstances
              Resource: 'arn:aws:ec2:*:*:instance/*'
            - Effect: Allow
              Action:
                - s3:ListAllMyBuckets
                - s3:GetBucketAcl
                - s3:GetBucketPolicy
                - s3:GetBucketLocation
                - s3:GetBucketPublicAccessBlock
                - s3:PutBucketPublicAccessBlock
              Resource: 'arn:aws:s3:::*'
            - Effect: Allow
              Action:
                - cloudtrail:LookupEvents
              Resource: 'arn:aws:cloudtrail:*:*:trail/*'
            - Effect: Allow
              Action:
                - iam:ListUsers
                - iam:ListAccessKeys
                - iam:GetUser
              Resource: 'arn:aws:iam::*:user/*'
            - Effect: Allow
              Action:
                - guardduty:ListDetectors
                - guardduty:ListFindings
                - guardduty:GetFindings
              Resource: 'arn:aws:guardduty:*:*:detector/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:CreateTable
                - dynamodb:DescribeTable
              Resource: 'arn:aws:dynamodb:*:*:table/aws-guardian-*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: 'arn:aws:ssm:*:*:parameter/aws-guardian/*'
            - Effect: Allow
              Action:
                - organizations:ListAccounts
              Resource: '*'
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: 'arn:aws:iam::*:role/aws-guardian-cross-account-role'
      Environment:
        Variables:
          PYTHONPATH: /var/task/lambda

  GuardianEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'rate(1 hour)'
      State: ENABLED
      Targets:
        - Id: guardian-checker
          Arn: !GetAtt GuardianCheckerFunction.Arn
          RoleArn: !GetAtt EventBridgeRole.Arn

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !GetAtt GuardianCheckerFunction.Arn

Outputs:
  GuardianCheckerFunctionArn:
    Value: !GetAtt GuardianCheckerFunction.Arn
    Description: ARN of Guardian Checker Lambda Function

  GuardianCheckerFunctionName:
    Value: !Ref GuardianCheckerFunction
    Description: Name of Guardian Checker Lambda Function
