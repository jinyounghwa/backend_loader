AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "AWS Guardian - Serverless AWS Security & Cost Monitoring System"

Globals:
  Function:
    Runtime: python3.14
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        AWS_ENV: localstack

Resources:
  GuardianChecker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aws-guardian-monitor
      Handler: guardian.handler.lambda_handler
      CodeUri: ./lambda/
      Description: Main Lambda handler for AWS Guardian security checks
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
                - ec2:Describe*
                - s3:ListAllMyBuckets
                - s3:GetBucketPolicy
                - s3:GetBucketAcl
                - s3:GetPublicAccessBlockConfiguration
                - dynamodb:PutItem
                - dynamodb:Query
                - ssm:GetParameter
              Resource: "*"
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 * * * ? *)
            Description: Run AWS Guardian security checks hourly

  DiscordWebhook:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aws-guardian-discord-webhook
      Handler: discord_webhook.handler.lambda_handler
      CodeUri: ./lambda/
      Description: Discord webhook handler for slash commands
      Timeout: 30
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
                - ec2:StopInstances
                - s3:PutBucketPolicy
              Resource: "*"
      Events:
        DiscordEvent:
          Type: Api
          Properties:
            Path: /discord/webhook
            Method: POST
            RestApiId: !Ref DiscordApi

  DiscordApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: aws-guardian-discord-api

Outputs:
  GuardianCheckerFunctionArn:
    Description: ARN of Guardian Checker Lambda function
    Value: !GetAtt GuardianChecker.Arn

  DiscordWebhookFunctionArn:
    Description: ARN of Discord Webhook Lambda function
    Value: !GetAtt DiscordWebhook.Arn

  DiscordApiEndpoint:
    Description: Discord Webhook API endpoint
    Value: !Sub "https://${DiscordApi}.execute-api.${AWS::Region}.amazonaws.com/prod/discord/webhook"
