AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'AWS Guardian - Real-time WebSocket Notification System'

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        AWS_ENV: prod
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  ProjectName:
    Type: String
    Default: aws-guardian
    Description: Project name for resource naming

Resources:
  # ==========================================
  # WebSocket API Gateway
  # ==========================================
  GuardianWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-websocket-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Description: AWS Guardian real-time threat notification system
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================
  # IAM Role for Lambda Functions
  # ==========================================
  WebSocketLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-websocket-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WebSocketManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GuardianWebSocketApi}/*'
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                Resource: '*'
        - PolicyName: DynamoDBAuditPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt WebSocketAuditLogsTable.Arn
        - PolicyName: DynamoDBStreamsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                  - dynamodb:ListShards
                Resource: !GetAtt WebSocketAuditLogsTable.StreamArn

  # ==========================================
  # Lambda Functions
  # ==========================================

  # $connect Route Handler
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-websocket-connect'
      CodeUri: ../lambda
      Handler: guardian/handlers/websocket_handler.handle_connect
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref GuardianWebSocketApi
          WEBSOCKET_API_ENDPOINT: !Sub '${GuardianWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com'
          CLOUDWATCH_NAMESPACE: 'aws-guardian/websocket'
          METRICS_ENABLED: 'true'
          AUDIT_LOGS_TABLE: !Ref WebSocketAuditLogsTable
          AUDIT_LOGS_ENABLED: 'true'
          TTL_DAYS: '90'
      Tags:
        - Key: Function
          Value: WebSocketConnect

  # $disconnect Route Handler
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-websocket-disconnect'
      CodeUri: ../lambda
      Handler: guardian/handlers/websocket_handler.handle_disconnect
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Environment:
        Variables:
          AUDIT_LOGS_TABLE: !Ref WebSocketAuditLogsTable
          AUDIT_LOGS_ENABLED: 'true'
          TTL_DAYS: '90'
      Tags:
        - Key: Function
          Value: WebSocketDisconnect

  # $default Route Handler
  DefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-websocket-default'
      CodeUri: ../lambda
      Handler: guardian/handlers/websocket_handler.handle_default
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Environment:
        Variables:
          CLOUDWATCH_NAMESPACE: 'aws-guardian/websocket'
          METRICS_ENABLED: 'true'
          AUDIT_LOGS_TABLE: !Ref WebSocketAuditLogsTable
          AUDIT_LOGS_ENABLED: 'true'
          TTL_DAYS: '90'
      Tags:
        - Key: Function
          Value: WebSocketDefault

  # Threat Broadcast Handler
  BroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-threat-broadcast'
      CodeUri: ../lambda
      Handler: guardian/handlers/websocket_handler.handle_threat_broadcast
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref GuardianWebSocketApi
          CLOUDWATCH_NAMESPACE: 'aws-guardian/websocket'
          METRICS_ENABLED: 'true'
          AUDIT_LOGS_TABLE: !Ref WebSocketAuditLogsTable
          AUDIT_LOGS_ENABLED: 'true'
          TTL_DAYS: '90'
      Tags:
        - Key: Function
          Value: ThreatBroadcast

  # Anomaly Alert Handler
  AnomalyAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-anomaly-alert'
      CodeUri: ../lambda
      Handler: guardian/handlers/websocket_handler.handle_anomaly_alert
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Tags:
        - Key: Function
          Value: AnomalyAlert

  # Connection Stats Handler
  ConnectionStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-connection-stats'
      CodeUri: ../lambda
      Handler: guardian/handlers/websocket_handler.handle_connection_stats
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Tags:
        - Key: Function
          Value: ConnectionStats

  # DynamoDB Stream Processor
  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-stream-processor'
      CodeUri: ../lambda
      Handler: guardian/handlers/stream_processor.handle_stream_event
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref GuardianWebSocketApi
          WEBSOCKET_API_ENDPOINT: !Sub '${GuardianWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com'
          AUDIT_LOGS_TABLE: !Ref WebSocketAuditLogsTable
      Tags:
        - Key: Function
          Value: StreamProcessor

  # EventSourceMapping: DynamoDB Stream -> Lambda
  StreamProcessorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt WebSocketAuditLogsTable.StreamArn
      FunctionName: !Ref StreamProcessorFunction
      Enabled: true
      BatchSize: 10
      BatchWindow: 5
      StartingPosition: LATEST
      MaximumRetryAttempts: 2
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ==========================================
  # Lambda Permissions
  # ==========================================
  ConnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GuardianWebSocketApi}/*'

  DisconnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GuardianWebSocketApi}/*'

  DefaultFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DefaultFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GuardianWebSocketApi}/*'

  BroadcastFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BroadcastFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GuardianWebSocketApi}/*'

  # ==========================================
  # API Integrations
  # ==========================================
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigatewayv2:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigatewayv2:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigatewayv2:${AWS::Region}:lambda:path/2015-03-31/functions/${DefaultFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # ==========================================
  # API Routes
  # ==========================================
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${ConnectIntegration}'
      AuthorizationType: NONE

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${DisconnectIntegration}'
      AuthorizationType: NONE

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${DefaultIntegration}'
      AuthorizationType: NONE

  # ==========================================
  # API Deployment Stage
  # ==========================================
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref GuardianWebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true
      LoggingLevel: INFO
      DataTraceEnabled: true
      DefaultRouteSettings:
        ThrottleSettings:
          BurstLimit: 100
          RateLimit: 50
      Tags:
        Environment: !Ref Environment

  # ==========================================
  # CloudWatch Log Group
  # ==========================================
  WebSocketApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-websocket'
      RetentionInDays: 30

  # ==========================================
  # DynamoDB Audit Logs Table
  # ==========================================
  WebSocketAuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-websocket-audit-logs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AccountIdTimestampIndex
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiration_time
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ==========================================
  # SNS Topic for Alerts
  # ==========================================
  WebSocketAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-websocket-alerts'
      DisplayName: WebSocket Monitoring Alerts

  # ==========================================
  # CloudWatch Dashboard
  # ==========================================
  WebSocketDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-websocket-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["aws-guardian/websocket", "ActiveConnections", {"stat": "Average"}],
                  [".", "MessageThroughput", {"stat": "Sum"}],
                  [".", "ThreatScore", {"stat": "Average"}],
                  [".", "MessageProcessingLatency", {"stat": "Average"}]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "WebSocket Metrics Overview",
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["aws-guardian/websocket", "ConnectionErrors", {"stat": "Sum"}],
                  [".", "DisconnectionErrors", {"stat": "Sum"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Error Monitoring",
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["aws-guardian/websocket", "ConnectionDuration", {"stat": "Average"}],
                  ["...", {"stat": "Maximum"}]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "Connection Duration (ms)"
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["aws-guardian/websocket", "MessageCompressionRatio", {"stat": "Average"}],
                  [".", "BroadcastLatency", {"stat": "Average"}]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "Performance Metrics"
              }
            }
          ]
        }

  # ==========================================
  # CloudWatch Alarms
  # ==========================================
  ConnectionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-websocket-connection-errors'
      AlarmDescription: Alert when connection errors exceed threshold
      MetricName: ConnectionErrors
      Namespace: aws-guardian/websocket
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref WebSocketAlertsTopic
      TreatMissingData: notBreaching

  MessageLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-websocket-message-latency'
      AlarmDescription: Alert when message processing latency exceeds threshold
      MetricName: MessageProcessingLatency
      Namespace: aws-guardian/websocket
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref WebSocketAlertsTopic
      TreatMissingData: notBreaching

  ThreatScoreAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-websocket-threat-score'
      AlarmDescription: Alert when threat score exceeds critical threshold
      MetricName: ThreatScore
      Namespace: aws-guardian/websocket
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref WebSocketAlertsTopic
      TreatMissingData: notBreaching

  # ==========================================
  # Audit Logs API (HTTP API Gateway)
  # ==========================================
  AuditApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-audit-api'
      ProtocolType: HTTP
      Description: WebSocket Audit Logs Query API
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AuditApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AuditApiGateway
      StageName: !Ref Environment
      AutoDeploy: true
      LoggingLevel: INFO
      DataTraceEnabled: true

  AuditApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuditApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigatewayv2:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAuditLogsFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  AuditApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuditApiGateway
      RouteKey: 'GET /audit-logs'
      Target: !Sub 'integrations/${AuditApiIntegration}'
      AuthorizationType: NONE

  GetAuditLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-get-audit-logs'
      CodeUri: ../lambda
      Handler: guardian/handlers/audit_api_handler.handle_get_audit_logs
      Runtime: python3.12
      Role: !GetAtt WebSocketLambdaRole.Arn
      Environment:
        Variables:
          AUDIT_LOGS_TABLE: !Ref WebSocketAuditLogsTable
      Tags:
        - Key: Function
          Value: GetAuditLogs

  GetAuditLogsFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetAuditLogsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuditApiGateway}/*'

  # ==========================================
  # Outputs
  # ==========================================

Outputs:
  WebSocketApiId:
    Description: WebSocket API ID
    Value: !Ref GuardianWebSocketApi
    Export:
      Name: !Sub '${ProjectName}-websocket-api-id'

  WebSocketApiEndpoint:
    Description: WebSocket API Endpoint
    Value: !Sub 'wss://${GuardianWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${ProjectName}-websocket-endpoint'

  ConnectFunctionArn:
    Description: Connect Function ARN
    Value: !GetAtt ConnectFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-connect-function-arn'

  DisconnectFunctionArn:
    Description: Disconnect Function ARN
    Value: !GetAtt DisconnectFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-disconnect-function-arn'

  BroadcastFunctionArn:
    Description: Broadcast Function ARN
    Value: !GetAtt BroadcastFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-broadcast-function-arn'

  Environment:
    Description: Deployment Environment
    Value: !Ref Environment

  ProjectName:
    Description: Project Name
    Value: !Ref ProjectName

  DashboardURL:
    Description: CloudWatch Dashboard URL
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProjectName}-websocket-dashboard'
    Export:
      Name: !Sub '${ProjectName}-DashboardURL'

  SNSTopicArn:
    Description: SNS Topic ARN for WebSocket alerts
    Value: !Ref WebSocketAlertsTopic
    Export:
      Name: !Sub '${ProjectName}-SNSTopicArn'

  AuditLogsTableName:
    Description: WebSocket Audit Logs Table Name
    Value: !Ref WebSocketAuditLogsTable
    Export:
      Name: !Sub '${ProjectName}-AuditLogsTable'

  AuditLogsTableArn:
    Description: WebSocket Audit Logs Table ARN
    Value: !GetAtt WebSocketAuditLogsTable.Arn
    Export:
      Name: !Sub '${ProjectName}-AuditLogsTableArn'

  AuditApiEndpoint:
    Description: Audit Logs API Endpoint
    Value: !Sub 'https://${AuditApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/audit-logs'
    Export:
      Name: !Sub '${ProjectName}-AuditApiEndpoint'

  AuditLogsStreamArn:
    Description: WebSocket Audit Logs DynamoDB Stream ARN
    Value: !GetAtt WebSocketAuditLogsTable.StreamArn
    Export:
      Name: !Sub '${ProjectName}-AuditLogsStreamArn'

  StreamProcessorFunctionArn:
    Description: Stream Processor Lambda Function ARN
    Value: !GetAtt StreamProcessorFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-StreamProcessorFunctionArn'
