name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety pip-audit requests

      - name: Run bandit security scan
        run: |
          bandit -r lambda/guardian -f json -o bandit-report.json
        continue-on-error: true

      - name: Run safety check
        run: |
          safety check --json > safety-report.json
        continue-on-error: true

      - name: Run pip-audit for dependencies
        run: |
          pip-audit --desc > pip-audit-report.txt
        continue-on-error: true

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for common credential patterns..."
          ! grep -r "password\s*=\s*['\"]" lambda/guardian/ || echo "Potential hardcoded password found"
          ! grep -r "api_key\s*=\s*['\"]" lambda/guardian/ || echo "Potential hardcoded API key found"
          ! grep -r "secret\s*=\s*['\"]" lambda/guardian/ || echo "Potential hardcoded secret found"
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'python'
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.txt
          retention-days: 30
