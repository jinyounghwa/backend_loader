name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-linters
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black mypy isort

      - name: Check code formatting with black
        run: |
          black --check lambda/guardian tests/backend

      - name: Check import sorting with isort
        run: |
          isort --check-only lambda/guardian tests/backend

      - name: Run pylint
        run: |
          pylint lambda/guardian --fail-under=8.0 --exit-zero
        continue-on-error: true

      - name: Run flake8
        run: |
          flake8 lambda/guardian --max-line-length=120 --count --show-source --statistics

      - name: Run mypy type checking
        run: |
          mypy lambda/guardian --ignore-missing-imports --show-error-codes
        continue-on-error: true

      - name: Generate pylint report
        run: |
          pylint lambda/guardian --output-format=json > pylint-report.json
        continue-on-error: true

      - name: Upload linting reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: linting-reports
          path: |
            pylint-report.json
          retention-days: 30
