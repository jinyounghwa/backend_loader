name: Deploy AWS Guardian

on:
  push:
    branches:
      - main
    paths:
      - 'lambda/**'
      - 'terraform/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lambda/**'
      - 'terraform/**'
      - 'requirements.txt'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # Stage 1: Lint - Code quality checks
  # ============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8 (Python linting)
        run: |
          flake8 lambda/ tests/ --count --show-source --statistics \
            --max-line-length=100 \
            --ignore=E203,W503

      - name: Check code formatting with black
        run: |
          black --check lambda/ tests/ --line-length=100

      - name: Check import sorting with isort
        run: |
          isort --check-only lambda/ tests/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.x

      - name: Validate Terraform
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run tfsec (Terraform security scanning)
        uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: terraform
          format: sarif
          out_dir: .

  # ============================================================================
  # Stage 2: Test - Unit tests with LocalStack
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock moto

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=lambda/guardian --cov-report=xml --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ============================================================================
  # Stage 3: Build - Package Lambda and prepare deployment artifacts
  # ============================================================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create Lambda package directories
        run: |
          mkdir -p build/lambda-guardian/lambda/guardian
          mkdir -p build/lambda-discord/lambda/discord_webhook

      - name: Package Guardian Lambda
        run: |
          cd build/lambda-guardian
          cp -r ../../lambda/guardian/* lambda/guardian/
          pip install -r ../../requirements.txt -t . --quiet
          zip -r ../../lambda_guardian.zip . -q
          cd ../..

      - name: Package Discord Webhook Lambda
        run: |
          cd build/lambda-discord
          cp -r ../../lambda/discord_webhook/* lambda/discord_webhook/
          pip install discord.py -t . --quiet
          zip -r ../../lambda_discord.zip . -q
          cd ../..

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v3
        with:
          name: lambda-packages
          path: |
            lambda_guardian.zip
            lambda_discord.zip
          retention-days: 1

      - name: Clean up build directories
        run: |
          rm -rf build

  # ============================================================================
  # Stage 4: Deploy - Apply Terraform to production
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://console.aws.amazon.com/lambda/home?region=us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v3
        with:
          name: lambda-packages
          path: terraform/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsDeployment

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.x

      - name: Terraform fmt check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TERRAFORM_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="telegram_bot_token=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -var="telegram_chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -var="discord_webhook_url=${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -var="discord_public_key=${{ secrets.DISCORD_PUBLIC_KEY }}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve tfplan

      - name: Verify Lambda deployment
        run: |
          aws lambda get-function \
            --function-name aws-guardian-monitor \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.FunctionArn'

      - name: Verify EventBridge rules
        run: |
          echo "Hourly rule status:"
          aws events describe-rule \
            --name aws-guardian-hourly-security \
            --region ${{ env.AWS_REGION }} \
            --query 'State'

          echo "Daily rule status:"
          aws events describe-rule \
            --name aws-guardian-daily-cost \
            --region ${{ env.AWS_REGION }} \
            --query 'State'

      - name: Send deployment notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'AWS Guardian deployed successfully to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        continue-on-error: true

      - name: Send deployment failure notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'AWS Guardian deployment FAILED'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        continue-on-error: true
