[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# importlib mode lets test modules that share a basename (e.g. tests/backend
# and tests/guardian both having test_performance.py) coexist without
# "import file mismatch" collection errors.
addopts = --import-mode=importlib
markers =
    integration: marks tests that require LocalStack integration
    benchmark: marks tests for performance benchmarking
    asyncio: marks tests that use asyncio
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:botocore.*
